<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduFix – Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--red:#e11d2e;--red2:#b3111f;--soft:#ffe9eb;--bg:#fff6f6;--card:#fff;--tx:#25141a;--mut:#86686d;--bd:#f5d6d9;--ok:#1f9d5b;--okbg:#e3f6ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Manrope,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
aside{width:232px;background:linear-gradient(180deg,#e11d2e,#a50f1c);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;flex:none}
.logo{font-weight:800;font-size:22px;padding:0 10px 22px;display:flex;gap:10px;align-items:center}
.logo i{background:#fff;color:var(--red);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-style:normal}
nav button{all:unset;display:flex;gap:12px;align-items:center;width:100%;padding:11px 12px;border-radius:12px;cursor:pointer;margin-bottom:4px;font-weight:600;opacity:.88;box-sizing:border-box}
nav button:hover{background:#ffffff22}nav button.on{background:#fff;color:var(--red);opacity:1}nav button:focus-visible{outline:2px solid #fff}
main{flex:1;min-width:0;padding:26px 30px 50px;max-width:1180px}
h1{font-size:32px;margin:0 0 4px;font-weight:800}h2{font-size:17px;margin:0 0 14px}.sub{color:var(--mut);margin:0 0 22px}
.grid{display:grid;gap:16px;margin-bottom:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px}
.stat{display:flex;gap:14px;align-items:center}.stat b{font-size:28px;display:block;line-height:1.1}.ic{width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:22px;flex:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--bd)}.row:first-of-type{border-top:0}
.tag{padding:4px 12px;border-radius:9px;font-size:13px;font-weight:700;background:var(--soft);color:var(--red);white-space:nowrap}.tag.ok{background:var(--okbg);color:var(--ok)}
.btn{all:unset;cursor:pointer;background:var(--red);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;text-align:center;box-sizing:border-box}.btn:hover{background:var(--red2)}.btn.ghost{background:var(--soft);color:var(--red)}.btn:focus-visible{outline:2px solid var(--tx)}
.x{all:unset;cursor:pointer;color:var(--mut);font-size:13px}.x:hover{color:var(--red)}
.bar{height:9px;border-radius:9px;background:var(--soft);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--red);border-radius:9px}
.tp{display:flex;align-items:center;gap:12px;margin:8px 0;cursor:pointer;padding:6px 8px;border-radius:10px}.tp:hover,.tp.on{background:var(--soft)}.tp span:first-child{width:120px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tp span:last-child{width:40px;text-align:right}
.chat{height:320px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}.m{max-width:80%;padding:10px 14px;border-radius:14px;background:var(--soft)}.m.u{align-self:flex-end;background:var(--red);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chips button{all:unset;cursor:pointer;border:1px solid var(--bd);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;color:var(--red)}
.f{display:flex;gap:8px;flex-wrap:wrap}.f input{flex:1;min-width:130px;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.sw{width:44px;height:25px;border-radius:20px;background:var(--bd);position:relative;cursor:pointer;border:0;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--red)}.sw.on::after{left:22px}
.hero{background:linear-gradient(120deg,#e11d2e,#ff4d5c);color:#fff;border:0;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.hero .btn{background:#fff;color:var(--red)}
.empty{color:var(--mut);padding:14px;border:1.5px dashed var(--bd);border-radius:14px;text-align:center}
.plan li{margin:7px 0}
@media(max-width:820px){body{flex-direction:column}aside{width:100%;height:auto;position:sticky;z-index:5;padding:10px}.logo{padding:0 6px 8px}nav{display:flex;overflow-x:auto;gap:4px}nav button{white-space:nowrap;width:auto;flex:none}main{padding:18px 14px}h1{font-size:26px}}
</style></head><body>
<aside><div class="logo"><i>🎓</i>EduFix</div><nav id="nav"></nav></aside>
<main id="v"></main>
<script>
const D={S:[],T:[],C:[],X:[]};
const N=[["Home","🏠"],["My Subjects","📚"],["Error Analysis","🔍"],["Courses","🎯"],["AI Assistant","🤖"],["Tests","📝"],["Progress","📈"],["Settings","⚙️"]];
const F={S:[["Subject name","text"],["Score (0–100)","number"]],T:[["Topic (e.g. SQL queries)","text"],["Errors, %","number"],["What to review (optional)","text"]],C:[["Course title","text"],["Number of lessons","number"]],X:[["Test title","text"],["Subject","text"],["Score (0–100)","number"]]};
const cl=n=>Math.max(0,Math.min(100,Math.round(+n)));
const B={S:v=>v[0]&&v[1]!==""?{n:v[0],s:cl(v[1]),d:new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}:0,
T:v=>v[0]&&v[1]!==""?{n:v[0],p:cl(v[1]),h:v[2]||"Review the basics and practice"}:0,
C:v=>v[0]?{n:v[0],l:Math.max(1,+v[1]||10),pr:0}:0,
X:v=>v[0]&&v[2]!==""?{n:v[0],b:v[1]||"–",s:cl(v[2])}:0};
let cur=0,sel=0,name="Alisher",set={n:true,w:true};
const $=s=>document.querySelector(s),go=i=>{cur=i;draw()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
function add(k){const v=F[k].map((_,i)=>$("#f"+i).value.trim());const o=B[k](v);if(!o){$("#f0").focus();return}D[k].push(o);draw()}
function del(k,i){D[k].splice(i,1);sel=0;draw()}
function step(i){const c=D.C[i];c.pr=Math.min(100,c.pr+Math.round(100/c.l));draw()}
const form=(k,btn)=>`<div class="card" style="margin-bottom:16px"><div class="f">${F[k].map((f,i)=>`<input id="f${i}" type="${f[1]}" placeholder="${f[0]}" ${f[1]=="number"?'min="0"':''} onkeydown="event.key=='Enter'&&add('${k}')">`).join("")}<button class="btn" onclick="add('${k}')">${btn}</button></div></div>`;
const empty=t=>`<div class="empty">${t}</div>`;
const donut=p=>`<svg viewBox="0 0 130 130" width="150"><circle cx="65" cy="65" r="54" fill="none" stroke="var(--soft)" stroke-width="16"/><circle cx="65" cy="65" r="54" fill="none" stroke="var(--red)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${3.393*p} 400" transform="rotate(-90 65 65)"/><text x="65" y="72" text-anchor="middle" font-size="24" font-weight="800" fill="var(--tx)">${p}%</text></svg>`;
const res=()=>D.S.length?D.S.map(s=>`<div class="row"><div><b>${esc(s.n)}</b><br><small style="color:var(--mut)">${s.d}</small></div><b>${s.s}/100</b><span class="tag ${s.s>=50?'ok':''}">${s.s>=50?'Passed':'Failed'}</span></div>`).join(""):empty("No subjects yet. Add the first one in My Subjects.");
const bars=(on)=>D.T.length?D.T.map((t,i)=>`<div class="tp ${on&&i==sel?'on':''}" ${on?`onclick="sel=${i};draw()"`:''}><span>${esc(t.n)}</span><div class="bar"><i style="width:${t.p}%"></i></div><span>${t.p}%</span></div>`).join(""):empty("No topics yet. Add error topics in Error Analysis.");
const crs=(a,all)=>a.length?a.map(c=>{const i=D.C.indexOf(c);return`<div class="card"><div style="display:flex;justify-content:space-between"><div class="ic">🎯</div>${all?`<button class="x" onclick="del('C',${i})">Remove</button>`:''}</div><h2 style="margin-top:12px">${esc(c.n)}</h2><small>${c.l} lessons</small>${c.pr?`<div style="display:flex;gap:10px;align-items:center;margin:12px 0"><div class="bar"><i style="width:${c.pr}%"></i></div><b>${c.pr}%</b></div>`:'<br><br>'}${c.pr>=100?'<span class="tag ok">Completed</span>':`<button class="btn" style="width:100%" onclick="step(${i})">${c.pr?'Next lesson':'Start learning'}</button>`}</div>`}).join(""):empty("No courses yet. Add one in Courses.");
function plan(){if(!D.T.length){$("#pl").innerHTML=empty("Add error topics first.");return}const t=[...D.T].sort((a,b)=>b.p-a.p),d=["Review theory","Practice","Solve tasks","Repeat","Mini test","Weak spots","Mock exam"];$("#pl").innerHTML="<ol class='plan'>"+d.map((x,i)=>`<li><b>Day ${i+1}:</b> ${x} – ${esc(t[i%t.length].n)}</li>`).join("")+"</ol>"}
function ans(q){q=q.toLowerCase();if(q.includes("join"))return"A JOIN combines rows from two tables by a condition. INNER keeps only matches, LEFT keeps all rows from the left table. Want a practice task?";if(q.includes("sql")||q.includes("query"))return"Check: 1) every selected column is in GROUP BY, 2) WHERE vs HAVING, 3) table aliases. Send me the query and I will go through it.";if(q.includes("normal"))return"Practice: a table has a column with products separated by commas. Bring it to 1NF, then 2NF and 3NF.";if(q.includes("plan")||q.includes("retake"))return"I can build a 7-day plan from your weakest topics. Open Error Analysis and press the plan button.";return"Got it! Tell me where exactly the mistake happens and I will suggest an explanation and tasks."}
function send(t){const i=$("#ci"),q=t||i.value.trim();if(!q)return;const c=$("#ch");c.innerHTML+=`<div class="m u">${esc(q)}</div>`;i.value="";setTimeout(()=>{c.innerHTML+=`<div class="m">${ans(q)}</div>`;c.scrollTop=1e5},400);c.scrollTop=1e5}
const chatBox=`<div class="chat" id="ch"><div class="m">Hi! I help you work through the topics where you make mistakes. Ask a question or request an explanation.</div></div><div class="chips">${["Explain what a JOIN is","Why does my SQL query not work?","Give me normalization tasks","Make a retake plan"].map(x=>`<button onclick="send('${x}')">${x}</button>`).join("")}</div><div class="f"><input id="ci" placeholder="Type your question..." onkeydown="event.key=='Enter'&&send()"><button class="btn" onclick="send()">Send</button></div>`;
const tg=k=>`<button class="sw ${set[k]?'on':''}" aria-label="toggle" onclick="set['${k}']=!set['${k}'];draw()"></button>`;
function view(){const S=D.S,T=D.T,C=D.C;if(sel>=T.length)sel=0;switch(cur){
case 0:return`<h1>Hello, ${esc(name)} 👋</h1><p class="sub">Keep learning and close your gaps. We will help!</p>
<div class="grid g4">${[["📕","Failed subjects",S.filter(s=>s.s<50).length],["📖","In progress",C.filter(c=>c.pr>0&&c.pr<100).length],["✅","Courses completed",C.filter(c=>c.pr>=100).length],["📊","Average score",S.length?avg(S.map(s=>s.s))+"%":"–"]].map(s=>`<div class="card stat"><div class="ic">${s[0]}</div><div>${s[1]}<b>${s[2]}</b></div></div>`).join("")}</div>
<div class="card hero" style="margin-bottom:16px"><div><h2 style="margin:0">Feature: personal retake plan</h2><span>We find your weak topics and build a 7-day plan.</span></div><button class="btn" onclick="go(2)">Open plan</button></div>
<div class="grid g2"><div class="card"><h2>Latest results</h2>${res()}</div><div class="card"><h2>Error analysis</h2>${T.length?`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${donut(avg(T.map(t=>t.p)))}<div style="flex:1;min-width:200px">${bars(0)}</div></div>`:empty("Add error topics to see the analysis.")}</div></div>
<div class="card" style="margin-bottom:16px"><h2>Recommended courses</h2><div class="grid g3" style="margin:0">${crs(C.slice(0,3),0)}</div></div>
<div class="card"><h2>AI Assistant</h2><p class="sub" style="margin:0 0 12px">Ask anything about your topics.</p><button class="btn" onclick="go(4)">Open chat</button></div>`;
case 1:return`<h1>My Subjects</h1><p class="sub">Add your own subjects and scores.</p>${form("S","Add subject")}<div class="grid g2">${S.length?S.map((s,i)=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><h2>${esc(s.n)}</h2><span class="tag ${s.s>=50?'ok':''}">${s.s>=50?'Passed':'Failed'}</span></div><div style="display:flex;gap:12px;align-items:center"><div class="bar"><i style="width:${s.s}%"></i></div><b>${s.s}/100</b></div><p style="color:var(--mut)">Added: ${s.d}</p>${s.s<50?'<button class="btn" onclick="go(2)">Analyze errors</button> ':''}<button class="x" onclick="del('S',${i})">Remove</button></div>`).join(""):empty("Your subjects will appear here.")}</div>`;
case 2:return`<h1>Error Analysis</h1><p class="sub">Add topics with error rates, then select one for details.</p>${form("T","Add topic")}<div class="grid g2"><div class="card"><h2>Errors by topic</h2>${bars(1)}</div><div class="card">${T.length?`<h2>${esc(T[sel].n)}</h2><p>Error rate: <b style="color:var(--red)">${T[sel].p}%</b></p><p style="color:var(--mut)">Review: ${esc(T[sel].h)}.</p><button class="btn" onclick="go(5)">Practice</button> <button class="btn ghost" onclick="plan()">Build 7-day plan</button> <button class="x" onclick="del('T',${sel})">Remove</button><div id="pl" style="margin-top:12px"></div>`:empty("Topic details will appear here.")}</div></div>`;
case 3:return`<h1>Courses</h1><p class="sub">Add courses and track your progress.</p>${form("C","Add course")}<div class="grid g3">${crs(C,1)}</div>`;
case 4:return`<h1>AI Assistant</h1><p class="sub">Explains topics, checks queries and builds plans.</p><div class="card" style="max-width:760px">${chatBox}</div>`;
case 5:return`<h1>Tests</h1><p class="sub">Add your tests and results.</p>${form("X","Add test")}<div class="card">${D.X.length?D.X.map((x,i)=>`<div class="row"><div><b>${esc(x.n)}</b><br><small style="color:var(--mut)">${esc(x.b)}</small></div><b>${x.s}/100</b><span class="tag ${x.s>=50?'ok':''}">${x.s>=50?'Passed':'Failed'}</span><button class="x" onclick="del('X',${i})">Remove</button></div>`).join(""):empty("Your tests will appear here.")}</div>`;
case 6:return`<h1>Progress</h1><p class="sub">Calculated from the data you add.</p><div class="grid g2"><div class="card"><h2>Average score</h2><div style="display:flex;justify-content:center">${donut(avg(S.map(s=>s.s)))}</div></div><div class="card"><h2>By subject</h2>${S.length?S.map(s=>`<div class="tp" style="cursor:default"><span>${esc(s.n)}</span><div class="bar"><i style="width:${s.s}%"></i></div><span>${s.s}%</span></div>`).join(""):empty("Add subjects to see progress.")}<h2 style="margin-top:18px">By course</h2>${C.length?C.map(c=>`<div class="tp" style="cursor:default"><span>${esc(c.n)}</span><div class="bar"><i style="width:${c.pr}%"></i></div><span>${c.pr}%</span></div>`).join(""):empty("Add courses to see progress.")}</div></div>`;
case 7:return`<h1>Settings</h1><p class="sub">Profile and notifications.</p><div class="card" style="max-width:560px"><div class="f" style="margin-bottom:16px"><input id="nm" value="${esc(name)}"><button class="btn" onclick="name=$('#nm').value.trim()||name;draw()">Save name</button></div>${[["n","Test notifications"],["w","Weekly report"]].map(x=>`<div class="row"><span>${x[1]}</span>${tg(x[0])}</div>`).join("")}</div>`}}
function draw(){$("#nav").innerHTML=N.map((n,i)=>`<button class="${i==cur?'on':''}" onclick="go(${i})"><span>${n[1]}</span>${n[0]}</button>`).join("");$("#v").innerHTML=view()}
draw();
</script></body></html>
